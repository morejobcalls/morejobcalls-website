<script>
(function () {
  var q = new URLSearchParams(location.search);
  var t = (q.get('t') || '').replace(/[^0-9]/g, '');
  var dest = 'https://www.youtube.com/watch?v=TvFv_EIM-MI' + (t ? '&t=' + t + 's' : '');

  } catch (e) {}
  setTimeout(go, 450);
})();
