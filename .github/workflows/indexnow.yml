name: IndexNow ping

# Bing's index is the retrieval layer for ChatGPT search and Copilot. Every push
# that changes a page tells Bing about it within minutes instead of waiting for
# Bingbot to find it on its own. Google ignores IndexNow; that side is
# Search Console (sitemap + request indexing), done by hand.
on:
  push:
    branches: [main]
    paths:
      - "**/*.html"
      - "sitemap.xml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # GitHub Pages takes a minute or two to publish; give it a head start so
      # Bingbot's first fetch sees the new version, not the old one.
      - name: Wait for Pages deploy
        run: sleep 120
      - name: Submit changed URLs
        run: python3 scripts/indexnow.py --changed | tee indexnow.txt
      - name: Job summary
        run: |
          { echo '```'; cat indexnow.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
